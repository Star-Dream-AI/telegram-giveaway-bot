[project]
name = "tg-giveaway-bot"
version = "0.1.0"
description = "Customizable Telegram giveaway bot with optional Cloudflare Turnstile anti-bot verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every coroutine test in this suite is written as a bare `async def`;
# per-test markers would be noise.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
