  btn_cancel: Cancel this giveaway

# Wizard for /newgiveaway.  Steps are numbered so an admin can see where
# they are; the draft lives in FSM state until the final "ok".
fsm:
  enter_title: "Giveaway title (1/7):"
  enter_description: "Description (2/7), or - to skip:"
  enter_prizes: |
    Prize tiers (3/7), one per line:
    name: count
    e.g.
    Steam card: 2
    R&D key: 1
  bad_prizes: |
    Could not parse that.  Every line must look like "name: count",
    for example "Steam card: 2".
  enter_channels: |
    Required channels (4/7), one @channel per line,
    or - to skip.  The bot must already be an administrator of every channel
    you list, and members are checked at join time.
  bad_channels: |
    The bot cannot use these channels — add it as an admin first:
    {channels}
  enter_duration: "Ends at (5/7): a duration like 2h / 3d / 1w, or an absolute time:"
  bad_duration: Could not read that time. Try "30m", "6h", "3d" or "2026-01-31 20:00".
  enter_turnstile: "Require a Cloudflare Turnstile captcha for joining? (6/7) yes/no:"
  enter_target: "Post it where (7/7): forward a channel post, or send @channel or the chat id:"
  bad_target: "Could not resolve that target. Forward a message from the channel, or send @channel."
  confirm: |
    Please check:
    Title: {title}
    Prizes: {prizes}
    Channels: {channels}
    Ends at: {ends_at}
    Captcha: {turnstile}
    Post to: {target}
    Send "ok" to publish, or /cancel to abort.
  saved: "✅ Giveaway published. Keep this message for controls:"
