  btn_cancel: 取消该抽奖

# /newgiveaway 向导。每个步骤带序号,草稿保存在 FSM 状态中,
# 直到最后一步输入 "ok" 才会真正创建。
fsm:
  enter_title: "抽奖标题 (1/7):"
  enter_description: "抽奖说明 (2/7),发送 - 可跳过:"
  enter_prizes: |
    奖项设置 (3/7),每行一个,格式为「名称:数量」,例如:
    Steam 礼品卡: 2
    内测兑换码: 1
  bad_prizes: |
    无法解析。每行都需要是「名称:数量」,
    例如「Steam 礼品卡: 2」。
  enter_channels: |
    要求加入的频道 (4/7),每行一个 @频道,
    发送 - 可跳过。机器人必须已经是所列频道的管理员,
    报名时会实时校验订阅状态。
  bad_channels: |
    机器人无法使用以下频道,请先把它设为管理员:
    {channels}
  enter_duration: "结束时间 (5/7):可填 30m / 6h / 3d 这样的时长,或填具体时间:"
  bad_duration: "无法识别该时间,请填写「30m」「6h」「3d」或「2026-01-31 20:00」。"
  enter_turnstile: "是否要求报名者通过 Cloudflare Turnstile 人机验证?(6/7) 是/否:"
  enter_target: "发布到哪里 (7/7):转发频道消息,或发送 @频道 / 数字 chat id:"
  bad_target: "无法定位该目标,请转发频道中的消息,或直接发送 @频道。"
  confirm: |
    请确认:
    标题: {title}
    奖项: {prizes}
    频道: {channels}
    结束时间: {ends_at}
    人机验证: {turnstile}
    发布到: {target}
    发送 "ok" 发布,发送 /cancel 放弃。
  saved: "✅ 抽奖已发布,保留本条消息可用于管理:"
