# =============================================================================
# 中文文案 / Chinese localization
# 每个 key 都必须在 en.yaml 中存在,测试会强制两边保持一致。
# -----------------------------------------------------------------------------
# 占位符 / Placeholders:
#   {title} {id} {count} {tier} {channels} {ends_at} {prizes} {target} {url}
#   {requested} {granted} {missing} {user_id} {status} {reason} {n}
#
# 消息以 Telegram HTML(ParseMode.HTML) 发送。所有插入的变量都先经过
# bot.utils.esc.esc() 转义,所以 "R&D key" 这类标题不会再触发
# "can't parse entities" 错误。
# =============================================================================

start:
  welcome: |
    👋 欢迎使用抽奖机器人!
    发送 /help 查看命令列表。
  help: |
    📖 命令列表

    • /start — 欢迎
    • /help — 本帮助
    • /lang — 切换语言 (zh / en)
    • /me — 我参与的抽奖

    管理员命令 (仅管理员)
    • /newgiveaway — 创建新抽奖
    • /list — 全部进行中的抽奖
    • /cancel <id> — 取消抽奖
    • /reroll <id> <tier> — 重抽已结束的奖项
    • /retry <id> — 重试未送达的中奖私信
    • /ban <user_id> [原因] — 拉黑用户(同时清除其报名记录)
    • /unban <user_id> — 解除拉黑
    • /addadmin <user_id> — 添加管理员
  lang_prompt: "请选择语言 / Please choose a language:"
  lang_set: "✅ 已切换为中文。"
  lang_unchanged: "你当前的语言就是中文。"
  me_empty: 你还没有参与过任何抽奖。
  me_header: "最近参与的抽奖(最多 {count} 条):"
  me_row: "• #{id} {title} — 状态:{status}"

common:
  cancel: 已取消。
  not_admin: "❌ 你不是管理员。"
  in_private_only: 请在与机器人的私聊中使用该命令。
  unknown_error: 出了点问题,请稍后再试。
  admin_only_hint: 发送 /help 查看你可以使用的命令。

